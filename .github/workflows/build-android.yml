name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @react-three/fiber @react-three/drei three --legacy-peer-deps

      - name: Build web assets
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDyptN2m-wIxze1jRJya1hGzqueKe510r4
          VITE_FIREBASE_AUTH_DOMAIN: tfcq-32a8b.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: tfcq-32a8b
          VITE_FIREBASE_STORAGE_BUCKET: tfcq-32a8b.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 1027395831145
          VITE_FIREBASE_APP_ID: 1:1027395831145:web:969f6de4cf9517755e29f8
          VITE_FIREBASE_MEASUREMENT_ID: G-1DWPEPHZDG
          VITE_BACKEND_URL: https://tfc.events
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Build AAB (release)
        working-directory: android
        run: ./gradlew bundleRelease -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
